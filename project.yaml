project:
  name: prov-agent-loop-exps
  description: Reusable capture, packaging, and analysis harness for PROV-Agent-Loop Flowcept experiments.
  flowcept_git_url: https://github.com/valescamoura/flowcept.git
  flowcept_git_branch: agent_loop

mongo:
  host: localhost
  port: 27017
  db: flowcept_pal_default
  collections:
    workflows: workflows
    tasks: tasks
    objects: objects
    agents: agents

redis:
  host: localhost
  port: 6379

experiment:
  default_profile: local_smoke
  default_repetitions: 3
  local_smoke_timeout_sec: 1800
